<app-header />

<main>
  <a
    class="back-link"
    [routerLink]="searchParams().from && searchParams().to ? '/passagens' : '/'"
    [queryParams]="searchParams()"
  >
    Voltar para viagens
  </a>
  <header class="page-heading">
    <p class="eyebrow">Mapa do ônibus</p>
    @if (from() && to()) {
      <h1>{{ from() }} <span class="route-separator">para</span> {{ to() }}</h1>
    } @else {
      <h1>Assentos da viagem</h1>
    }
    <div class="trip-meta" aria-label="Informações da viagem">
      @if (departureLabel()) {
        <span>{{ departureLabel() }}</span>
      }
      @if (company()) {
        <span>{{ company() }}</span>
      }
      @if (seatClass()) {
        <span>{{ seatClass() }}</span>
      }
    </div>
  </header>

  <app-seat-selector
    [travelId]="travelId()"
    [maximumAllowedPassengers]="maximumAllowedPassengers()"
    (checkout)="goToCheckout($event)"
  />
</main>
