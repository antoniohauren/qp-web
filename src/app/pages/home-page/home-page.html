<app-header />

<main>
  <header class="page-heading">
    <p class="eyebrow">Rede rodoviária</p>
    <h1 id="stops-heading">Escolha seu embarque</h1>
    <p>Busque uma cidade ou estação para começar sua viagem.</p>
  </header>

  <section aria-labelledby="stops-heading">
    @if (loading()) {
      <p class="status" role="status">Carregando cidades e estações...</p>
    } @else if (loadError()) {
      <p class="status status-error" role="alert">
        Não foi possível carregar as cidades. Tente novamente mais tarde.
      </p>
    } @else {
      <div class="route-picker">
        <div class="route-selectors">
          <button class="stop-selector" type="button" (click)="stopDialog.open('origin')">
            <span>
              <span class="kind">Origem</span>
              <strong>{{ selectedStop()?.name ?? 'Selecione local' }}</strong>
            </span>
            <span class="selector-arrow" aria-hidden="true">›</span>
          </button>

          <button class="stop-selector" type="button" (click)="stopDialog.open('destination')">
            <span>
              <span class="kind">Destino</span>
              <strong>{{ selectedDestination()?.name ?? 'Selecione local' }}</strong>
            </span>
            <span class="selector-arrow" aria-hidden="true">›</span>
          </button>

          <button class="stop-selector" type="button" (click)="dateDialog.open()">
            <span>
              <span class="kind">Data da viagem</span>
              <strong>{{ selectedDateLabel() }}</strong>
            </span>
            <span class="selector-arrow" aria-hidden="true">›</span>
          </button>
        </div>

        <button
          class="route-action swap-stops"
          type="button"
          aria-label="Trocar origem e destino"
          [class.swap-a]="swapAnimation() === 'swap-a'"
          [class.swap-b]="swapAnimation() === 'swap-b'"
          (click)="swapStops()"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m8 7 3-3-3-3M11 4H6a3 3 0 0 0-3 3v10m13 0-3 3 3 3m-3-3h5a3 3 0 0 0 3-3V7" />
          </svg>
        </button>

        <button
          class="route-action tomorrow-date"
          type="button"
          aria-label="Selecionar amanhã"
          title="Amanhã"
          (click)="selectTomorrow()"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M7 2v3m10-3v3M4 9h16M6 4h12a2 2 0 0 1 2 2v14H4V6a2 2 0 0 1 2-2Z" />
            <path d="m13 13 3 3-3 3m3-3h-6" />
          </svg>
        </button>

        <button
          class="search-button"
          type="button"
          [disabled]="searchDisabled()"
          [routerLink]="['/passagens']"
          [queryParams]="{
            from: selectedStop()?.id,
            to: selectedDestination()?.id,
            date: selectedDate(),
          }"
        >
          Buscar passagens
          <mat-icon aria-hidden="true" fontSet="material-symbols-outlined">arrow_forward</mat-icon>
        </button>
      </div>
    }
  </section>
</main>

<app-stop-selector-dialog
  #stopDialog
  [cities]="cities()"
  [destination]="selectedDestination()"
  [origin]="selectedStop()"
  (selected)="selectStop($event)"
/>

<app-date-picker-dialog
  #dateDialog
  [selectedDate]="selectedDate()"
  (selected)="selectedDate.set($event)"
/>
